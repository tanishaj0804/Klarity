name: klarity
version: "0.2.0"
config-version: 2
profile: klarity

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Schemas Fivetran creates inside the BRONZE database (check with: SHOW SCHEMAS IN DATABASE BRONZE)
  bronze_postgres_schema: PG_PUBLIC
  bronze_mysql_schema: MYSQL_CRM
  bronze_oracle_schema: ORACLE_KLARITY_APP
  # geolocation (1M rows) is not synced by default. Switch on with --vars '{use_geolocation: true}'
  use_geolocation: false

models:
  klarity:
    staging:
      +materialized: view
    silver:
      +materialized: table
