
name: klarity
version: "0.2.0"
config-version: 2
profile: klarity

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Schemas Fivetran creates inside the BRONZE database
  bronze_postgres_schema: POSTGRES_PUBLIC
  bronze_mysql_schema: crm
  bronze_oracle_schema: ORACLE_KLARITY_APP

  # Geolocation (1M rows) is not synced by default
  use_geolocation: false

  # New variables
  payment_types: [credit_card, boleto, voucher, debit_card, not_defined]
  reprocess_days: 30

models:
  klarity:
    staging:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table
      +database: GOLD
      +schema: MART
      intermediate:
        +materialized: view

snapshots:
  klarity:
    +database: GOLD
    +schema: MART
